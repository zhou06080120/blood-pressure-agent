<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>血压计客服 Agent — 多轮对话</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0f1117;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── 顶部 ── */
  header {
    background: #1a1d27;
    border-bottom: 1px solid #2d3148;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  header h1 { font-size: 18px; font-weight: 600; color: #34d399; }
  header .subtitle { font-size: 12px; color: #64748b; flex: 1; }
  .header-actions { display: flex; gap: 8px; }
  .header-btn {
    padding: 5px 14px;
    border-radius: 6px;
    border: 1px solid #3d4163;
    background: transparent;
    color: #94a3b8;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .header-btn:hover { border-color: #059669; color: #34d399; }
  .session-info { font-size: 11px; color: #475569; font-family: monospace; }

  /* ── 模式切换 ── */
  .mode-toggle {
    display: flex;
    gap: 8px;
    padding: 10px 24px;
    background: #131520;
    border-bottom: 1px solid #2d3148;
    align-items: center;
  }
  .mode-btn {
    padding: 4px 14px;
    border-radius: 16px;
    border: 1px solid #3d4163;
    background: transparent;
    color: #94a3b8;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .mode-btn.active {
    background: #059669;
    border-color: #059669;
    color: #fff;
  }

  /* ── 聊天区 ── */
  .chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scrollbar-width: thin;
    scrollbar-color: #3d4163 transparent;
  }
  .chat-container::-webkit-scrollbar { width: 6px; }
  .chat-container::-webkit-scrollbar-thumb { background: #3d4163; border-radius: 3px; }

  /* ── 消息气泡 ── */
  .msg-row { display: flex; gap: 10px; animation: fadeIn 0.3s ease; }
  .msg-row.user { flex-direction: row-reverse; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }

  .avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }
  .avatar.user { background: #3d4163; }
  .avatar.bot  { background: #065f46; }

  .msg-bubble {
    max-width: 75%;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg-row.user .msg-bubble {
    background: #1e3a5f;
    border: 1px solid #2563eb;
    color: #e2e8f0;
  }
  .msg-row.bot .msg-bubble {
    background: #1a1d27;
    border: 1px solid #065f46;
    color: #e2e8f0;
  }

  /* ── 思考过程折叠区（在 assistant 气泡下方） ── */
  .trace-card {
    margin-left: 44px;
    background: #1a1d27;
    border: 1px solid #2d3148;
    border-radius: 8px;
    overflow: hidden;
    animation: fadeIn 0.3s ease;
  }
  .trace-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    cursor: pointer;
    user-select: none;
    font-size: 12px;
    color: #64748b;
  }
  .trace-header:hover { color: #94a3b8; }
  .trace-toggle { color: #64748b; font-size: 11px; }
  .trace-toggle.open::before { content: "▲"; }
  .trace-toggle:not(.open)::before { content: "▼"; }
  .trace-body { padding: 0 14px 10px; display: none; }
  .trace-body.open { display: block; }

  .step-block { margin-bottom: 8px; }
  .step-badge {
    display: inline-block;
    background: #2d3148;
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 10px;
    color: #64748b;
    font-weight: 600;
    margin-right: 6px;
  }
  .tool-pill {
    display: inline-block;
    background: #14352a;
    border: 1px solid #065f46;
    border-radius: 4px;
    padding: 1px 7px;
    font-size: 11px;
    color: #34d399;
    font-family: monospace;
  }
  .thought-text { color: #38bdf8; font-size: 12px; margin: 4px 0; }
  .obs-text {
    color: #cbd5e1; font-size: 12px;
    background: #0d1017; border-radius: 4px;
    padding: 5px 8px; margin-top: 4px;
    max-height: 160px; overflow-y: auto;
    white-space: pre-wrap;
  }

  /* ── 输入区 ── */
  .input-area {
    background: #1a1d27;
    border-top: 1px solid #2d3148;
    padding: 14px 24px;
    flex-shrink: 0;
  }
  .examples { margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .example-chip {
    background: #1e2235;
    border: 1px solid #2d3148;
    border-radius: 14px;
    padding: 3px 10px;
    font-size: 11px;
    color: #94a3b8;
    cursor: pointer;
    transition: all 0.2s;
  }
  .example-chip:hover { border-color: #059669; color: #34d399; }
  .input-row { display: flex; gap: 10px; }
  textarea {
    flex: 1;
    background: #0f1117;
    border: 1px solid #2d3148;
    border-radius: 8px;
    color: #e2e8f0;
    padding: 10px 14px;
    font-size: 14px;
    resize: none;
    min-height: 48px;
    max-height: 120px;
    outline: none;
    transition: border-color 0.2s;
  }
  textarea:focus { border-color: #059669; }
  .send-btn {
    padding: 0 24px;
    background: #059669;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }
  .send-btn:hover:not(:disabled) { background: #047857; }
  .send-btn:disabled { background: #3d4163; cursor: not-allowed; }

  /* ── 状态指示 ── */
  .status-text { font-size: 12px; color: #64748b; margin-left: 44px; margin-bottom: 6px; display: none; }
  .status-text.visible { display: flex; align-items: center; gap: 6px; }
  .spinner {
    width: 12px; height: 12px;
    border: 2px solid #3d4163;
    border-top-color: #059669;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── 医疗免责声明页脚（合规要求常驻展示，与 API done 事件同款文案） ── */
  .disclaimer-bar {
    background: #131520;
    border-top: 1px solid #2d3148;
    padding: 10px 24px;
    font-size: 11px;
    line-height: 1.6;
    color: #64748b;
    text-align: center;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<header>
  <h1>🩺 血压计客服 Agent</h1>
  <div class="subtitle">多轮对话 · Thought → Action → Observation | FAQ知识库 + 故障排查 + 测量指南</div>
  <div class="header-actions">
    <span class="session-info" id="sessionInfo">未创建会话</span>
    <button class="header-btn" onclick="newConversation()">新对话</button>
  </div>
</header>

<div class="mode-toggle">
  <span style="font-size:12px;color:#64748b;margin-right:4px;">实现方式：</span>
  <button class="mode-btn active" data-mode="manual" onclick="setMode('manual',this)">手写 Prompt 解析</button>
  <button class="mode-btn" data-mode="fc" onclick="setMode('fc',this)">Function Calling</button>
</div>

<div class="chat-container" id="chatContainer">
  <div class="msg-row bot">
    <div class="avatar bot">🤖</div>
    <div class="msg-bubble">您好！我是血压计客服助手，可以帮您解答袖带绑法、测量姿势、正常范围、故障排查、蓝牙连接、APP使用等问题。请问有什么可以帮您？</div>
  </div>
</div>

<div class="status-text" id="statusText"><div class="spinner"></div><span id="statusLabel">思考中...</span></div>

<div class="input-area">
  <div class="examples">
    <span style="font-size:11px;color:#475569;margin-right:4px;">示例：</span>
    <span class="example-chip" onclick="setQuestion(this.textContent)">血压计袖带怎么绑？</span>
    <span class="example-chip" onclick="setQuestion(this.textContent)">测出来偏高怎么办？</span>
    <span class="example-chip" onclick="setQuestion(this.textContent)">收缩压135舒张压85正常吗？</span>
    <span class="example-chip" onclick="setQuestion(this.textContent)">蓝牙连不上APP</span>
    <span class="example-chip" onclick="setQuestion(this.textContent)">欧姆龙HEM-7156袖带范围</span>
  </div>
  <div class="input-row">
    <textarea id="question" placeholder="输入问题，支持多轮对话追问..." rows="1"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendQuery()">发 送</button>
  </div>
</div>

<!-- ── 医疗免责声明（固定页脚，常驻展示；文案与 src/compliance.py 的 MEDICAL_DISCLAIMER 一致） ── -->
<footer class="disclaimer-bar">
  ⚠️ 以上内容由 AI 生成。本回答仅供健康教育参考，不能替代执业医师诊疗意见；如有不适或异常读数，请及时就医。
</footer>

<script>
  let currentMode = 'manual';
  let isRunning   = false;
  let sessionId   = null;

  function setMode(mode, btn) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  function setQuestion(text) {
    const ta = document.getElementById('question');
    ta.value = text;
    ta.focus();
  }

  function setStatus(text, visible) {
    const el = document.getElementById('statusText');
    document.getElementById('statusLabel').textContent = text;
    el.classList.toggle('visible', visible);
  }

  function setSendEnabled(enabled) {
    const btn = document.getElementById('sendBtn');
    btn.disabled = !enabled;
    btn.textContent = enabled ? '发 送' : '运行中...';
    isRunning = !enabled;
  }

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function scrollBottom() {
    const c = document.getElementById('chatContainer');
    c.scrollTop = c.scrollHeight;
  }

  // ── 会话管理 ──────────────────────────────────────────────────────────────
  async function ensureSession() {
    if (sessionId) return;
    try {
      const resp = await fetch('/session/create', { method: 'POST' });
      const data = await resp.json();
      sessionId = data.session_id;
      document.getElementById('sessionInfo').textContent = `会话: ${sessionId.slice(0,8)}…`;
    } catch (e) {
      console.error('创建会话失败', e);
    }
  }

  async function newConversation() {
    sessionId = null;
    document.getElementById('chatContainer').innerHTML = '';
    addBotMessage('已开始新对话。请问有什么可以帮您？');
    await ensureSession();
  }

  // ── 添加消息气泡 ──────────────────────────────────────────────────────────
  function addUserMessage(text) {
    const row = document.createElement('div');
    row.className = 'msg-row user';
    row.innerHTML = `<div class="avatar user">我</div><div class="msg-bubble">${esc(text)}</div>`;
    document.getElementById('chatContainer').appendChild(row);
    scrollBottom();
  }

  function addBotMessage(text) {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.innerHTML = `<div class="avatar bot">🤖</div><div class="msg-bubble">${esc(text)}</div>`;
    document.getElementById('chatContainer').appendChild(row);
    scrollBottom();
  }

  // ── 创建思考过程折叠卡（assistant 气泡下方的 ReAct 步骤） ──────────────────
  function createTraceCard() {
    const card = document.createElement('div');
    card.className = 'trace-card';
    card.innerHTML = `
      <div class="trace-header" onclick="this.nextElementSibling.classList.toggle('open'); this.querySelector('.trace-toggle').classList.toggle('open')">
        <span class="trace-toggle open"></span>
        <span>🔍 推理过程</span>
      </div>
      <div class="trace-body open"></div>`;
    document.getElementById('chatContainer').appendChild(card);
    scrollBottom();
    return card.querySelector('.trace-body');
  }

  function appendStep(traceBody, stepData, isManual) {
    const block = document.createElement('div');
    block.className = 'step-block';

    let html = `<span class="step-badge">Step ${stepData.step}</span>`;

    if (isManual && stepData.thought) {
      html += `<div class="thought-text">🧠 ${esc(stepData.thought)}</div>`;
    } else if (!isManual) {
      html += `<div class="thought-text" style="color:#475569;font-style:italic">🧠 （模型内部推理，不可见）</div>`;
    }

    html += `<span class="tool-pill">${esc(stepData.action)}</span>`;
    html += `<div style="font-size:11px;color:#94a3b8;font-family:monospace;margin:3px 0">${esc(JSON.stringify(stepData.action_input||{}, null, 2))}</div>`;
    html += `<div class="obs-text">👁 ${esc((stepData.observation||'').replace(/\n{3,}/g,'\n\n').trim())}</div>`;

    block.innerHTML = html;
    traceBody.appendChild(block);
    scrollBottom();
  }

  function finalizeBotBubble(text, steps, elapsed) {
    const rows = document.querySelectorAll('.msg-row.bot');
    const lastBubble = rows[rows.length-1].querySelector('.msg-bubble');
    lastBubble.innerHTML = esc(text);
    // 更新 trace header
    const traceCard = document.querySelector('.trace-card:last-child .trace-header');
    if (traceCard) {
      traceCard.innerHTML = `<span class="trace-toggle open"></span><span>🔍 推理过程（${steps}步 · ${elapsed}s）</span>`;
    }
    scrollBottom();
  }

  function showError(msg) {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.innerHTML = `<div class="avatar bot">🤖</div><div class="msg-bubble" style="border-color:#7f1d1d;color:#f87171">⚠️ ${esc(msg)}</div>`;
    document.getElementById('chatContainer').appendChild(row);
    scrollBottom();
  }

  // ── 主发送逻辑 ────────────────────────────────────────────────────────────
  async function sendQuery() {
    if (isRunning) return;
    const question = document.getElementById('question').value.trim();
    if (!question) return;

    await ensureSession();
    document.getElementById('question').value = '';
    setSendEnabled(false);

    // 渲染用户消息
    addUserMessage(question);
    // 预渲染 assistant 占位气泡
    addBotMessage('…');
    // 创建推理过程折叠卡
    const traceBody = createTraceCard();

    setStatus('正在连接...', true);

    const endpoint = `/query/${currentMode}`;
    const startTime = Date.now();
    let actionStepCount = 0;
    const isManual = (currentMode === 'manual');

    try {
      const resp = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, max_steps: 10, session_id: sessionId }),
      });

      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

      const reader  = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          let data;
          try { data = JSON.parse(line.slice(6)); } catch { continue; }

          if (data.type === 'start') {
            setStatus(`🧠 思考中... (带入${data.history_turns||0}轮历史)`, true);

          } else if (data.type === 'action') {
            actionStepCount++;
            setStatus(`Step ${data.step}：调用 ${data.action}...`, true);
            appendStep(traceBody, data, isManual);

          } else if (data.type === 'final') {
            const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
            finalizeBotBubble(data.answer, actionStepCount, elapsed);
            setStatus('', false);

          } else if (data.type === 'max_steps' || data.type === 'error') {
            const rows = document.querySelectorAll('.msg-row.bot');
            rows[rows.length-1].querySelector('.msg-bubble').innerHTML =
              `<span style="color:#f87171">⚠️ ${esc(data.answer || data.observation || '未知错误')}</span>`;
            setStatus('', false);

          } else if (data.type === 'done') {
            setStatus('', false);
          }
        }
      }
    } catch (err) {
      showError(`请求失败: ${err.message}`);
      setStatus('', false);
    } finally {
      setSendEnabled(true);
    }
  }

  // 回车发送（Shift+Enter 换行），textarea 自适应高度
  const ta = document.getElementById('question');
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendQuery(); }
  });
  ta.addEventListener('input', () => {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
  });

  // 页面加载时自动创建会话
  ensureSession();
</script>
</body>
</html>
