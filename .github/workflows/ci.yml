# ═════════════════════════════════════════════════════════════════
# CI 流水线：lint → 单元测试（带覆盖率门槛）→ Docker 镜像构建
#
# 设计要点：
#   - Python 3.10 / 3.12 双版本矩阵（requires-python 下限 + 开发环境版本）
#   - 测试全程零外部依赖：占位 API Key + 强制模型降级路径（见 tests/conftest.py），
#     本地与 CI 行为完全一致，无需真实 Key / 本地模型即可全量跑通
#   - 覆盖率门槛 30%（pyproject addopts 内置）：LLM 真实调用路径由集成环境覆盖
#   - Docker 构建使用 GHA 层缓存，仅在 lint + 测试通过后执行
# ═════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install toolchain
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff check
        run: ruff check .

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project with dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # 覆盖率参数已内置于 pyproject [tool.pytest.ini_options] addopts
      - name: Run tests with coverage
        run: pytest

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          retention-days: 7

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (with GHA cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: blood-pressure-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
